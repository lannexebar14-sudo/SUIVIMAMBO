function setRoundTimer(id,left,total,size='phone'){const e=document.getElementById(id);if(!e)return;left=Math.max(0,Math.ceil(Number(left)||0));total=Math.max(1,Number(total)||1);e.textContent=left;e.classList.add('chronoRing');e.classList.toggle('chronoTV',size==='tv');e.classList.toggle('chronoPhone',size==='phone');e.classList.toggle('chronoMini',size==='mini');const pct=Math.min(100,Math.max(0,(1-left/total)*100)),warn=Math.max(6,Math.min(10,Math.ceil(total/3))),color=left<=5?'#ff3b5c':left<=warn?'#ff9f1a':'#7c4dff';e.style.setProperty('--p',pct+'%');e.style.setProperty('--ring',color);e.style.boxShadow='0 0 34px '+(left<=5?'#ff3b5c66':left<=warn?'#ff9f1a55':'#7c4dff55')+',inset 0 0 18px #0008';e.classList.toggle('danger',left>0&&left<=5)}function updateTVClockNow(s,se){if(s.phase==='intermission'){const e=document.getElementById('tvBreak');if(e)e.textContent=formatBreakTime(breakSecondsLeft(s))}if(s.phase==='countdown'){const left=Math.max(0,COUNTDOWN-secSince(s.countdown_started_at||s.phase_started_at));setRoundTimer('tvCount',left,COUNTDOWN,'tv')}if(s.phase==='question'){const total=se?.question_duration||60,left=Math.max(0,total-secSince(s.question_started_at));setRoundTimer('tvTime',left,total,'tv')}if(s.phase==='leaderboard'){const e=document.getElementById('tvBetween');if(e){const between=Math.max(0,Number(se?.between_question_duration??10));e.textContent=Math.max(0,Math.ceil(between-secSince(s.leaderboard_started_at||s.phase_started_at)))}}}function startTVClock(s,se){clearInterval(tvTimer);updateTVClockNow(s,se);tvTimer=setInterval(()=>updateTVClockNow(s,se),200)}
async function advanceGame(s){if(busyAdvance)return;busyAdvance=true;try{const se=await getSession(s),duration=se?.question_duration||60,between=Math.max(0,Number(se?.between_question_duration??10)),revealDelay=REVEAL,leaderboardDelay=between,now=serverNowIso();if(s.phase==='intermission'){const total=Math.max(0,Number(s.paused_remaining||0));if(total<=0||secSince(s.paused_at||s.phase_started_at)>=total){const resumeSame=s.paused_phase==='resume_same',last=(s.question_index||0)+1>=(se?.question_count||0);if(resumeSame)await patchState({phase:'countdown',countdown_started_at:now,question_started_at:null,reveal_started_at:null,leaderboard_started_at:null,leaderboard_hidden:false,phase_started_at:now,paused_remaining:null,paused_phase:null,paused_at:null},'&phase=eq.intermission');else if(last)await patchState({phase:'leaderboard',leaderboard_started_at:now,phase_started_at:now,paused_remaining:null,paused_phase:null,paused_at:null},'&phase=eq.intermission');else await patchState({question_index:(s.question_index||0)+1,phase:'countdown',countdown_started_at:now,question_started_at:null,reveal_started_at:null,leaderboard_started_at:null,leaderboard_hidden:false,phase_started_at:now,paused_remaining:null,paused_phase:null,paused_at:null},'&phase=eq.intermission')}return}if(s.phase==='countdown'&&secSince(s.countdown_started_at||s.phase_started_at)>=COUNTDOWN)await patchState({phase:'question',question_started_at:now,phase_started_at:now},'&phase=eq.countdown');else if(s.phase==='question'&&secSince(s.question_started_at)>=duration){await rpc('mambo_quiz_finalize_question',{p_question:s.question_index});await patchState({phase:'reveal',reveal_started_at:now,phase_started_at:now},'&phase=eq.question')}else if(s.phase==='reveal'&&secSince(s.reveal_started_at||s.phase_started_at)>=revealDelay){const showBoard=(((s.question_index||0)+1)%5===0)||(((s.question_index||0)+1)>=(se?.question_count||0));await patchState({phase:'leaderboard',leaderboard_hidden:!showBoard,leaderboard_ function startPlayerClock(s,se){clearInterval(window._pclock);const upd=()=>{if(s.phase==='intermission'){const e=document.getElementById('pBreak');if(e)e.textContent=formatBreakTime(breakSecondsLeft(s))}if(s.phase==='countdown'){const left=Math.max(0,COUNTDOWN-secSince(s.countdown_started_at||s.phase_started_at));setRoundTimer('pCount',left,COUNTDOWN,'phone')}if(s.phase==='question'){const total=se?.question_duration||60,left=Math.max(0,total-secSince(s.question_started_at));setRoundTimer('pTime',left,total,'mini')}};upd();window._pclock=setInterval(upd,200)}
async function submitAnswers(arr){if(answering)return;answering=true;try{const id=getSavedPlayerId();if(id&&!localStorage.getItem('mambo_player'))localStorage.setItem('mambo_player',id);const s=await getState(),se=await getSession(s),left=Math.max(0,Math.ceil((se?.question_duration||60)-secSince(s.question_started_at)));const r=await rpc('mambo_quiz_submit_answers',{p_player:id,p_question:s.question_index,p_answers:arr,p_base_points:100,p_seconds_left:left});if(Number(r)===-3)throw Error('Sélectionne exactement le bon nombre de réponses');await playerTick(true)}catch(e){toast(e.message)}finally{answering=false}}async function sendAnswer(i){return submitAnswers([i])}async function pickAnswer(i){if(answering)return;const s=await getState(),q=await getQuestion(s);if(q?.question_type!=='multi')return sendAnswer(i);const k=multiSelected.indexOf(i);if(k>=0)multiSelected.splice(k,1);else if(multiSelected.length<2)multiSelected.push(i);else return toast('2 réponses maximum');document.querySelectorAll('.phoneAnswer').forEach((b,j)=>{const on=multiSelected.includes(j);b.style.outline=on?'3px solid #ffd45a':'';b.style.transform=on?'scale(1.02)':''});let v=document.getElementById('multiValidate');if(!v){v=document.createElement('button');v.id='multiValidate';v.className='btn green full';v.textContent='VALIDER MES 2 RÉPONSES';v.onclick=validateMulti;document.querySelector('.phoneAnswers')?.insertAdjacentElement('afterend',v)}v.disabled=multiSelected.length!==2}async function validateMulti(){if(multiSelected.length!==2)return toast('Sélectionne 2 réponses');await submitAnswers([...multiSelected])}
async function playerTick(force=false){try{const id=getSavedPlayerId();if(id&&!localStorage.getItem('mambo_player'))localStorage.setItem('mambo_player',id);if(!id){if(await recoverPlayer(true)){return playerTick(true)}playJoin();clearInterval(playerPoll);return}let s=await getState();let d=await playerData(id,s);const _between=Math.max(0,Number(d.se?.between_question_duration??10)),_localBreakAdvance=s.status==='running'&&((s.phase==='intermission'&&breakSecondsLeft(s)<=0)||(s.phase==='leaderboard'&&s.paused_phase==='pending_break'&&Number(s.paused_remaining)>0&&secSince(s.leaderboard_started_at||s.phase_started_at)>=_between));if(_localBreakAdvance){try{await advanceGame(s)}catch(e){console.warn('local intermission advance',e)}s=await getState();d=await playerData(id,s)}else{const _due=s.status==='running'&&((s.phase==='countdown'&&secSince(s.countdown_started_at||s.phase_started_at)>=COUNTDOWN)||(s.phase==='question'&&secSince(s.question_started_at)>=(d.se?.question_duration||60))||(s.phase==='reveal'&&secSince(s.reveal_started_at||s.phase_started_at)>=REVEAL)||(s.phase==='leaderboard'&&secSince(s.leaderboard_started_at||s.phase_started_at)>=_between));if(_due){try{await rpc('mambo_quiz_advance_game',{})}catch(e){console.warn('server advance',e)}s=await getState();d=await playerData(id,s)}}const key=[d.p?.approval_status,s.phase,s.question_index,s.status,!!d.ans,d.p?.score,d.p?.speed_bonus].join('|');if(force||key!==playerKey){playerKey=key;await renderPlayer(s,d)}}catch(e){console.error(e)}}function startPlayer(){clearInterval(playerPoll);playerTick(true);playerPoll=setInterval(()=>playerTick(false),1000)}async function play(){const id=getSavedPlayerId();if(id){savePlayerId(id);startPlayer();return}if(await recoverPlayer(true)){startPlayer();return}playJoin()}

async function confirmIntermission(){const sec=Math.max(60,Math.min(1800,Number(document.getElementById('breakDuration')?.value||300))),s=await getState(),se=await getSession(s);if(s?.status!=='running')return toast('Le quiz n’est pas en cours');const last=(s.question_index||0)+1>=(se?.question_count||0),noNext=last&&['question','reveal','leaderboard'].includes(s.phase);if(noNext)return toast('Pas d’entracte après la dernière question');const now=serverNowIso();if(s.phase==='intermission')await patchState({paused_remaining:sec,paused_phase:s.paused_phase||'resume_increment',paused_at:now,phase_started_at:now},'&phase=eq.intermission');else if(s.phase==='countdown')await patchState({phase:'intermission',paused_remaining:sec,paused_phase:'resume_same',paused_at:now,phase_started_at:now},'&phase=eq.countdown');else if(s.phase==='leaderboard')await patchState({phase:'intermission',paused_remaining:sec,paused_phase:'resume_increment',paused_at:now,phase_started_at:now,leaderboard_hidden:false},'&phase=eq.leaderboard');else await patchState({paused_remaining:sec,paused_phase:'pending_break',paused_at:null});closeIntermissionModal();toast(['countdown','leaderboard','intermission'].includes(s.phase)?'Entracte lancé':'Entracte programmé après la question');refreshStaff()}

@media(max-width:700px){.wz-steps{gap:4px}.wz-step{font-size:9px;padding:8px 2px}.wz-catgrid{grid-template-columns:1fr}.wz-choicegrid{grid-template-columns:1fr 1fr}.wz-nav{flex-direction:column}.wz-toolbar .btn{min-width:100%}.wz-group summary{font-size:13px}}

function wzStepBar(){const names=['CATÉGORIES','QUESTIONS','TEMPS','LOTS','RÉCAP'];return `<div class="wz-steps">${names.map((n,i)=>`<div class="wz-step ${WZ_CFG.step===i+1?'on':WZ_CFG.step>i+1?'done':''}">${i+1}<br>${n}</div>`).join('')}</div>`}
function wzShell(content){app.innerHTML=`<div class="page"><div class="staff"><div class="top"><div><div class="brand">LE MAMBO • STAFF</div><div class="muted">Création du quiz — étape ${WZ_CFG.step}/5</div></div><button class="btn alt" onclick="wzCancel()">✕ ANNULER</button></div><div class="wz-wrap box">${wzCss()}${wzStepBar()}${content}</div></div></div>`}
function wzSelectedAvailable(){return WZ_CFG.selected.filter(c=>(WZ_CFG.counts[c]||0)>0)}
function wzAvailableTotal(){return wzSelectedAvailable().reduce((s,c)=>s+(WZ_CFG.counts[c]||0),0)}
function wzQuestionOptions(){const total=wzAvailableTotal();if(total<=0)return[];if(total<5)return[total];const max=Math.min(100,Math.floor(total/5)*5);const out=[];for(let n=5;n<=max;n+=5)out.push(n);return out}
function wzNormalizeCount(){const opts=wzQuestionOptions();if(!opts.length)return;if(!opts.includes(WZ_CFG.count))WZ_CFG.count=opts.includes(50)?50:opts[opts.length-1]}
function wzCapture(){if(WZ_CFG.step===2){const e=document.getElementById('wzCount');if(e)WZ_CFG.count=Number(e.value)||WZ_CFG.count}if(WZ_CFG.step===3){const e=document.getElementById('wzBetween');if(e)WZ_CFG.between=Math.max(0,Math.min(120,Number(e.value)||0))}if(WZ_CFG.step===4){WZ_CFG.prize1=(document.getElementById('wzPrize1')?.value||'').trim();WZ_CFG.prize2=(document.getElementById('wzPrize2')?.value||'').trim();WZ_CFG.prize3=(document.getElementById('wzPrize3')?.value||'').trim()}}
async function wzLoadCounts(){try{const rows=await rpc('mambo_quiz_category_counts',{}),map=Object.fromEntries((rows||[]).map(r=>[r.category,Number(r.question_count||0)]));WZ_CFG.counts=Object.fromEntries(WZ_ALL.map(c=>[c,map[c]||0]));if(!WZ_CFG.selected.length)WZ_CFG.selected=WZ_ALL.filter(c=>(WZ_CFG.counts[c]||0)>0);else WZ_CFG.selected=WZ_CFG.selected.filter(c=>(WZ_CFG.counts[c]||0)>0);wzNormalizeCount()}catch(e){console.error(e);throw new Error('Impossible de charger les catégories')}}
function wzShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wzSpecial(q){return ['multi','trap','intruder'].includes(String(q?.question_type||'').toLowerCase())}
function wzAllocate(cats,pools,count){const active=wzShuffle(cats.filter(c=>(pools[c]?.length||0)>0).slice()),quota=Object.fromEntries(active.map(c=>[c,0]));const cap=active.length>1?Math.ceil(count/2):count;let assigned=0;while(assigned<count){let moved=false;const order=wzShuffle(active.slice()).sort((a,b)=>quota[a]-quota[b]);for(const c of order){if(assigned>=count)break;const limit=Math.min(pools[c]?.length||0,cap);if(quota[c]<limit){quota[c]++;assigned++;moved=true}}if(!moved)break}return{active,quota,assigned}}
function wzBuildSequence(cats,pools,quota,count){const buckets={},left={};for(const c of cats){buckets[c]={special:wzShuffle((pools[c]||[]).filter(wzSpecial).slice()),normal:wzShuffle((pools[c]||[]).filter(q=>!wzSpecial(q)).slice())};left[c]=quota[c]||0}const out=[];let last=null;for(let pos=0;pos<count;pos++){let allowed=cats.filter(c=>left[c]>0&&c!==last);if(!allowed.length)allowed=cats.filter(c=>left[c]>0);if(!allowed.length)break;const wantSpecial=(pos+1)%5===0;let candidates;if(wantSpecial){const withSpecial=allowed.filter(c=>buckets[c].special.length>0);if(withSpecial.length){const maxSpecial=Math.max(...withSpecial.map(c=>left[c]));candidates=withSpecial.filter(c=>left[c]===maxSpecial)}else{const max=Math.max(...allowed.map(c=>left[c]));candidates=allowed.filter(c=>left[c]===max)}}else{const max=Math.max(...allowed.map(c=>left[c]));candidates=allowed.filter(c=>left[c]===max)}const c=candidates[Math.floor(Math.random()*candidates.length)];let q;if(wantSpecial&&buckets[c].special.length)q=buckets[c].special.pop();else if(buckets[c].normal.length)q=buckets[c].normal.pop();else q=buckets[c].special.pop();if(!q)break;out.push(q);left[c]--;last=c}return out}

function wzRender(){if(WZ_CFG.step===1){const grouped=new Set(WZ_GROUPS.flatMap(g=>g.cats)),groups=[...WZ_GROUPS],rest=WZ_ALL.filter(c=>!grouped.has(c));if(rest.length)groups.push({name:'📚 AUTRES',cats:rest});wzShell(`<div class="label">ÉTAPE 1</div><h1 class="wz-title">CHOISIS LES CATÉGORIES</h1><p class="muted">Les catégories sont rangées dans des menus repliables.</p><div class="wz-toolbar"><button class="btn green" onclick="wzToggleAll(true)">TOUT SÉLECTIONNER</button><button class="btn alt" onclick="wzToggleAll(false)">TOUT DÉSÉLECTIONNER</button></div><div class="pill" style="display:inline-block"><span id="wzSelCount">${WZ_CFG.selected.length} sélectionnée${WZ_CFG.selected.length>1?'s':''}</span></div>${groups.map((g,gi)=>{const items=g.cats.filter(c=>WZ_ALL.includes(c)),active=items.filter(c=>(WZ_CFG.counts[c]||0)>0).length;return `<details class="wz-group" ${gi===0?'open':''}><summary>${g.name}<span class="muted">${active}/${items.length} disponibles ▾</span></summary><div class="wz-catgrid">${items.map(c=>{const n=WZ_CFG.counts[c]||0,off=n===0,checked=WZ_CFG.selected.includes(c);return `<label class="wz-cat ${off?'off':''}"><input type="checkbox" value="${esc(c)}" ${checked?'checked':''} ${off?'disabled':''} onchange="wzCatChange(this)"><b>${esc(c)}</b><span class="wz-count">${off?'BIENTÔT':n>=1000?'1000+ questions':n+' question'+(n>1?'s':'')}</span></label>`}).join('')}</div></details>`}).join('')}<div class="wz-nav"><button class="btn green" onclick="wzNext()">SUIVANT →</button></div>`);return}if(WZ_CFG.step===2){wzNormalizeCount();const opts=wzQuestionOptions();wzShell(`<div class="label">ÉTAPE 2</div><h1 class="wz-title">NOMBRE DE QUESTIONS</h1><div class="wz-info"><b>${wzAvailableTotal()} questions</b> disponibles dans les catégories sélectionnées.</div><select id="wzCount" class="wz-select">${opts.map(n=>`<option value="${n}" ${n===WZ_CFG.count?'selected':''}>${n} QUESTIONS</option>`).join('')}</select><div class="wz-nav"><button class="btn alt" onclick="wzPrev()">← PRÉCÉDENT</button><button class="btn green" onclick="wzNext()">SUIVANT →</button></div>`);return}if(WZ_CFG.step===3){wzShell(`<div class="label">ÉTAPE 3</div><h1 class="wz-title">TEMPS DE JEU</h1><p class="muted">Temps laissé pour répondre à chaque question.</p><div class="wz-choicegrid">${[10,20,30,45,60,90].map(n=>`<button class="wz-choice ${WZ_CFG.duration===n?'on':''}" onclick="wzPickDuration(${n})">${n} s</button>`).join('')}</div><div style="margin-top:22px"><div class="label">TEMPS ENTRE LES QUESTIONS</div><input id="wzBetween" class="input" type="number" inputmode="numeric" min="0" max="120" value="${WZ_CFG.between}" style="max-width:250px"><p class="muted">0 à 120 secondes.</p></div><div class="wz-nav"><button class="btn alt" onclick="wzPrev()">← PRÉCÉDENT</button><button class="btn green" onclick="wzNext()">SUIVANT →</button></div>`);return}if(WZ_CFG.step===4){wzShell(`<div class="label">ÉTAPE 4</div><h1 class="wz-title">LOTS DU PODIUM</h1><p class="muted">Facultatif : laisse vide si aucun lot n'est prévu.</p><input id="wzPrize1" class="input" maxlength="80" value="${esc(WZ_CFG.prize1)}" placeholder="🥇 1er — ex. 50 €"><input id="wzPrize2" class="input" maxlength="80" value="${esc(WZ_CFG.prize2)}" placeholder="🥈 2e — ex. 1 conso"><input id="wzPrize3" class="input" maxlength="80" value="${esc(WZ_CFG.prize3)}" placeholder="🥉 3e — ex. 1 shooter"><div class="wz-nav"><button class="btn alt" onclick="wzPrev()">← PRÉCÉDENT</button><button class="btn green" onclick="wzNext()">SUIVANT →</button></div>`);return}const cats=wzSelectedAvailable(),mins=Math.max(1,Math.round(WZ_CFG.count*(WZ_CFG.duration+8+WZ_CFG.between)/60));wzShell(`<div class="label">ÉTAPE 5</div><h1 class="wz-title">RÉCAPITULATIF</h1><p class="muted">Vérifie les réglages avant de lancer la partie.</p><div class="wz-summary"><div class="row"><b>Catégories</b><b>${cats.length}</b></div><div>${cats.map(c=>`<span class="wz-chip">${esc(c)}</span>`).join('')}</div><div class="row"><b>Questions</b><b>${WZ_CFG.count}</b></div><div class="row"><b>Temps / question</b><b>${WZ_CFG.duration} s</b></div><div class="row"><b>Entre les questions</b><b>${WZ_CFG.between} s</b></div><div class="row"><b>Alternance</b><b>${cats.length>1?'✅ Jamais 2 fois la même catégorie':'1 seule catégorie'}</b></div><div class="row"><b>Durée estimée</b><b>≈ ${mins} min</b></div>${WZ_CFG.prize1?`<div class="row"><b>🥇 1er</b><b>${esc(WZ_CFG.prize1)}</b></div>`:''}${WZ_CFG.prize2?`<div class="row"><b>🥈 2e</b><b>${esc(WZ_CFG.prize2)}</b></div>`:''}${WZ_CFG.prize3?`<div class="row"><b>🥉 3e</b><b>${esc(WZ_CFG.prize3)}</b></div>`:''}</div><div class="wz-nav"><button class="btn alt" onclick="wzPrev()">← PRÉCÉDENT</button><button class="btn green" onclick="wzLaunchFinal()">🚀 LANCER LE QUIZ</button></div>`)}
