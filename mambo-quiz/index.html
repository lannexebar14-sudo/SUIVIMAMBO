async function quizDeepStats(s,knownRows){
  try{
    const [answers,players]=await Promise.all([
      db(`mambo_quiz_answers?session_id=eq.${s.current_session_id}&finalized=eq.true&select=player_id,correct,response_seconds,question_index,created_at&order=question_index.asc,created_at.asc`),
      db(`mambo_quiz_players?session_id=eq.${s.current_session_id}&approval_status=eq.approved&select=id,nickname,avatar,score,streak,previous_rank,joined_at&order=score.desc,joined_at.asc`)
    ]);
    const latest=new Map();
    for(const a of answers||[])latest.set(String(a.player_id)+'|'+Number(a.question_index),a);
    const byPlayer=new Map();
    for(const a of latest.values()){
      const id=a.player_id;
      if(!byPlayer.has(id))byPlayer.set(id,[]);
      byPlayer.get(id).push(a);
    }
    let fastest=null,bestStreak=null,mostCorrect=null;
    for(const p of players||[]){
      const arr=(byPlayer.get(p.id)||[]).sort((a,b)=>Number(a.question_index)-Number(b.question_index));
      let correct=0,run=0,longest=0;
      for(const a of arr){
        if(a.correct===true){
          correct++;run++;longest=Math.max(longest,run);
          const rs=Number(a.response_seconds);
          if(Number.isFinite(rs)&&(!fastest||rs<fastest.value))fastest={player:p,value:rs};
        }else run=0;
      }
      if(!bestStreak||longest>bestStreak.value)bestStreak={player:p,value:longest};
      if(!mostCorrect||correct>mostCorrect.value)mostCorrect={player:p,value:correct,total:arr.length};
    }
    const ranks=knownRows?.length?knownRows:players||[];
    let biggestClimb=null;
    ranks.forEach((p,i)=>{
      const current=i+1,prev=Number(p.previous_rank||0),delta=prev?prev-current:0;
      if(delta>0&&(!biggestClimb||delta>biggestClimb.value))biggestClimb={player:p,value:delta,current,prev};
    });
    return {fastest,bestStreak,mostCorrect,biggestClimb,players:players||[],answers:[...latest.values()]};
  }catch(e){
    console.warn('quizDeepStats',e);
    return {fastest:null,bestStreak:null,mostCorrect:null,biggestClimb:null,players:[],answers:[]};
  }
}

function wzShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wzSpecial(q){return ['multi','trap','intruder'].includes(String(q?.question_type||'').toLowerCase())}
function wzAllocate(cats,pools,count){const active=wzShuffle(cats.filter(c=>(pools[c]?.length||0)>0).slice()),quota=Object.fromEntries(active.map(c=>[c,0]));const cap=active.length>1?Math.ceil(count/2):count;let assigned=0;while(assigned<count){let moved=false;const order=wzShuffle(active.slice()).sort((a,b)=>quota[a]-quota[b]);for(const c of order){if(assigned>=count)break;const limit=Math.min(pools[c]?.length||0,cap);if(quota[c]<limit){quota[c]++;assigned++;moved=true}}if(!moved)break}return{active,quota,assigned}}
function wzBuildSequence(cats,pools,quota,count){const buckets={},left={};for(const c of cats){buckets[c]={special:wzShuffle((pools[c]||[]).filter(wzSpecial).slice()),normal:wzShuffle((pools[c]||[]).filter(q=>!wzSpecial(q)).slice())};left[c]=quota[c]||0}const out=[];let last=null;for(let pos=0;pos<count;pos++){let allowed=cats.filter(c=>left[c]>0&&c!==last);if(!allowed.length)allowed=cats.filter(c=>left[c]>0);if(!allowed.length)break;const wantSpecial=(pos+1)%5===0;let candidates;if(wantSpecial){const withSpecial=allowed.filter(c=>buckets[c].special.length>0);if(withSpecial.length){const maxSpecial=Math.max(...withSpecial.map(c=>left[c]));candidates=withSpecial.filter(c=>left[c]===maxSpecial)}else{const max=Math.max(...allowed.map(c=>left[c]));candidates=allowed.filter(c=>left[c]===max)}}else{const max=Math.max(...allowed.map(c=>left[c]));candidates=allowed.filter(c=>left[c]===max)}const c=candidates[Math.floor(Math.random()*candidates.length)];let q;if(wantSpecial&&buckets[c].special.length)q=buckets[c].special.pop();else if(buckets[c].normal.length)q=buckets[c].normal.pop();else q=buckets[c].special.pop();if(!q)break;out.push(q);left[c]--;last=c}return out}

/* MAMBO CODE CHALLENGE V1 */
let codeChallengeSubmitting=false;
async function getCodeChallengeWinner(se){
  if(!se?.challenge_winner_id)return null;
  try{return (await db(`mambo_quiz_players?id=eq.${se.challenge_winner_id}&select=id,nickname,avatar,score&limit=1`))?.[0]||null}
  catch(e){console.warn('challenge winner',e);return null}
}
function challengeSecondsLeft(s){return Math.max(0,15-secSince(s?.phase_started_at))}
function challengeHuntSecondsLeft(s){return Math.max(0,90-secSince(s?.phase_started_at))}
function formatChallengeTime(sec){sec=Math.max(0,Math.ceil(Number(sec)||0));const m=Math.floor(sec/60),r=sec%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
async function submitCodeChallenge(){
  if(codeChallengeSubmitting)return;
  const input=document.getElementById('challengeCodeInput'),msg=document.getElementById('challengeCodeMsg');
  const code=(input?.value||'').trim();
  if(!code){if(msg)msg.textContent='Entre le code trouvé.';return}
  codeChallengeSubmitting=true;
  const btn=document.getElementById('challengeCodeBtn');if(btn)btn.disabled=true;
  try{
    const player=getSavedPlayerId();
    const r=await rpc('mambo_quiz_submit_code_challenge',{p_player:player,p_code:code});
    if(r?.won){if(msg)msg.textContent='🏆 GAGNÉ ! +'+Number(r.points||0)+' points';await playerTick(true);return}
    if(r?.reason==='wrong'){if(msg)msg.textContent='❌ Mauvais code — cherche encore !';if(input){input.value='';input.focus()}}
    else if(r?.reason==='too_fast'){if(msg)msg.textContent='Attends une seconde avant de réessayer.'}
    else if(r?.reason==='timeout'){if(msg)msg.textContent='⏱ Temps écoulé !';await playerTick(true)}
    else if(r?.reason==='already_won'||r?.reason==='closed'){if(msg)msg.textContent='Trop tard, le défi est terminé.';await playerTick(true)}
    else if(msg)msg.textContent='Impossible de valider ce code.';
  }catch(e){if(msg)msg.textContent=e.message||String(e)}
  finally{codeChallengeSubmitting=false;if(btn)btn.disabled=false}
}

const _renderTVBeforeCodeChallenge=renderTV;
renderTV=async function(s){
  const phase=s?.phase||'lobby';
  if(!['code_challenge','code_challenge_won','code_challenge_timeout'].includes(phase))return _renderTVBeforeCodeChallenge(s);
  const se=await getSession(s);
  let html='';
  if(phase==='code_challenge'){
    const hunt=challengeHuntSecondsLeft(s);
    html=`<div class="page hero"><div class="codeChallengeHero"><div class="brand">LE MAMBO • GRAND QUIZ</div><div class="codeChallengeIcon">🔐</div><h1 class="big" style="margin:10px 0">DÉFI CODE SECRET</h1><div class="codeChallengePoints">⚡ PREMIER À TROUVER • +${Number(se?.challenge_points||200)} POINTS</div><div id="tvChallengeHunt" class="timer" style="margin:18px auto">${formatChallengeTime(hunt)}</div><div class="label" style="margin-top:18px">OÙ TROUVER LE CODE ?</div><div class="codeChallengeLocation">${esc(se?.challenge_location||'Cherche le code dans le Mambo')}</div><p style="font-size:20px;font-weight:900">Trouve le code avant la fin du chrono, puis saisis-le sur ton téléphone.</p><p class="muted">Déplace-toi prudemment • inutile de courir.</p></div></div>`;
  }else if(phase==='code_challenge_timeout'){

    html=`<div class="page hero"><div class="codeChallengeHero"><div class="brand">DÉFI CODE SECRET</div><div class="codeChallengeIcon">⏱️</div><div class="codeChallengeWinner">TEMPS ÉCOULÉ !</div><p style="font-size:22px;font-weight:900">PERSONNE N’A TROUVÉ LE CODE</p><p style="font-size:22px;font-weight:900;margin-top:24px">QUESTION SUIVANTE DANS</p><div id="tvChallengeNext" class="timer">${left}</div></div></div>`;
  }else{
    const w=await getCodeChallengeWinner(se),left=Math.max(0,Math.ceil(challengeSecondsLeft(s)));
    html=`<div class="page hero"><div class="codeChallengeHero"><div class="brand">DÉFI CODE SECRET</div><div class="codeChallengeIcon">🏆</div><div class="codeChallengeWinner">${w?avatarOf(w)+' '+esc(w.nickname):'CODE TROUVÉ !'}</div><div class="codeChallengePoints">+${Number(se?.challenge_points||200)} POINTS</div><p style="font-size:22px;font-weight:900;margin-top:24px">QUESTION SUIVANTE DANS</p><div id="tvChallengeNext" class="timer">${left}</div></div></div>`;
  }
  if(s.status==='running')html+=tvJoinFooter(s);
  app.innerHTML=html;
  startTVClock(s,se);
};

updateTVClockNow=function(s,se){
  _updateTVClockBeforeCodeChallenge(s,se);
  if(s.phase==='code_challenge'){
    const e=document.getElementById('tvChallengeHunt');
    if(e)e.textContent=formatChallengeTime(challengeHuntSecondsLeft(s));
  }
  if(s.phase==='code_challenge_won'||s.phase==='code_challenge_timeout'){
    const e=document.getElementById('tvChallengeNext');
    if(e)e.textContent=Math.max(0,Math.ceil(challengeSecondsLeft(s)));
  }
};

// TV/local state engine: challenge starts after the chosen correction and winner screen lasts exactly 15s.
const _advanceGameBeforeCodeChallenge=advanceGame;
advanceGame=async function(s){
  if(!s)return;
  const now=serverNowIso();
  if(s.status==='running'&&s.phase==='reveal'&&secSince(s.reveal_started_at||s.phase_started_at)>=REVEAL){
    const se=await getSession(s);
    const trigger=!!se?.challenge_enabled&&!se?.challenge_winner_id&&Number(se?.challenge_after_question)===(Number(s.question_index||0)+1)&&(Number(s.question_index||0)+1)<Number(se?.question_count||0);
    if(trigger){
      await patchState({phase:'code_challenge',phase_started_at:now,leaderboard_started_at:null,leaderboard_hidden:true,paused_remaining:null,paused_phase:null,paused_at:null},'&phase=eq.reveal');
      return;
    }
  }
  if(s.status==='running'&&s.phase==='code_challenge'){
    if(secSince(s.phase_started_at)>=90)await rpc('mambo_quiz_advance_game',{});
    return;
  }
  if(s.status==='running'&&(s.phase==='code_challenge_won'||s.phase==='code_challenge_timeout')){
    if(secSince(s.phase_started_at)>=15)await rpc('mambo_quiz_advance_game',{});
    return;
  }
  return _advanceGameBeforeCodeChallenge(s);
};

// Player: code entry and winner countdown.
const _renderPlayerBeforeCodeChallenge=renderPlayer;
renderPlayer=async function(s,d){
  const {p,se}=d||{};
  if(p?.approval_status==='approved'&&s?.phase==='code_challenge'){
    app.innerHTML=`<div class="phone"><div class="box"><div class="brand">LE MAMBO • GRAND QUIZ</div><div class="codeChallengeIcon" style="font-size:72px">🔐</div><h1>DÉFI CODE SECRET</h1><div class="codeChallengePoints">+${Number(se?.challenge_points||200)} POINTS</div><p class="muted" style="margin:16px 0 4px">TEMPS RESTANT</p><div id="pChallengeHunt" class="code" style="font-size:58px">${formatChallengeTime(challengeHuntSecondsLeft(s))}</div><div class="label" style="margin-top:16px">LE CODE EST PLACÉ ICI</div><div class="codeChallengeLocation" style="font-size:24px;padding:16px">${esc(se?.challenge_location||'Dans le Mambo')}</div><p><b>Le premier à saisir le bon code avant la fin du chrono gagne les points.</b></p><input id="challengeCodeInput" class="input codeChallengePhoneInput" maxlength="20" autocomplete="off" autocapitalize="characters" placeholder="ENTRE LE CODE"><button id="challengeCodeBtn" class="btn green full" onclick="submitCodeChallenge()">VALIDER LE CODE</button><div id="challengeCodeMsg" class="muted" style="margin-top:12px;min-height:20px"></div><p class="muted" style="font-size:12px">Déplace-toi prudemment • inutile de courir.</p></div></div>`;
    const input=document.getElementById('challengeCodeInput');if(input)input.onkeydown=e=>{if(e.key==='Enter')submitCodeChallenge()};
    startPlayerClock(s,se);
    return;
  }
  if(p?.approval_status==='approved'&&s?.phase==='code_challenge_timeout'){
    const left=Math.max(0,Math.ceil(challengeSecondsLeft(s)));
    app.innerHTML=`<div class="phone"><div class="box"><div class="brand">DÉFI CODE SECRET</div><div class="codeChallengeIcon" style="font-size:72px">⏱️</div><h1>TEMPS ÉCOULÉ !</h1><p>Personne n’a trouvé le code à temps.</p><p class="muted" style="margin-top:18px">Question suivante dans</p><div id="pChallengeNext" class="code" style="font-size:64px">${left}</div></div></div>`;
    startPlayerClock(s,se);
    return;
  }
  if(p?.approval_status==='approved'&&s?.phase==='code_challenge_won'){
    const w=await getCodeChallengeWinner(se),mine=se?.challenge_winner_id===p.id,left=Math.max(0,Math.ceil(challengeSecondsLeft(s)));
    app.innerHTML=`<div class="phone"><div class="box"><div class="brand">DÉFI CODE SECRET</div><div class="codeChallengeIcon" style="font-size:72px">${mine?'🏆':'🔐'}</div><h1>${mine?'TU AS GAGNÉ !':'CODE TROUVÉ !'}</h1>${mine?`<div class="codeChallengePoints">+${Number(se?.challenge_points||200)} POINTS</div>`:`<h2>${w?avatarOf(w)+' '+esc(w.nickname):'Un joueur'} a été le plus rapide.</h2>`}<p class="muted" style="margin-top:18px">Question suivante dans</p><div id="pChallengeNext" class="code" style="font-size:64px">${left}</div><p class="muted">Ton score : ${p.score||0} pts</p></div></div>`;
    startPlayerClock(s,se);
    return;
  }
  return _renderPlayerBeforeCodeChallenge(s,d);
};

const _startPlayerClockBeforeCodeChallenge=startPlayerClock;
startPlayerClock=function(s,se){
  _startPlayerClockBeforeCodeChallenge(s,se);
  if(s.phase==='code_challenge'){
    clearInterval(window._pclock);
    const upd=()=>{const e=document.getElementById('pChallengeHunt');if(e)e.textContent=formatChallengeTime(challengeHuntSecondsLeft(s))};

};

};

async function queueMiniGame(type){

    const r=await rpc('mambo_quiz_minigame_queue',{

async function refreshMiniGameStaffStatus(){

  if(mg.status==='pending')el.textContent='🟣 '+x.title+' • PROGRAMMÉ APRÈS LA QUESTION '+mg.after_question+' • '+Number(mg.points||0)+' PTS À DISTRIBUER';
  else if(mg.status==='active')el.textContent='🟢 '+x.title+' • EN COURS • '+Number(mg.points||0)+' PTS À DISTRIBUER';
  else if(mg.status==='result')el.textContent='🟡 '+x.title+' • RÉSULTAT AFFICHÉ';
  else if(mg.status==='finished')el.textContent='✅ DERNIER MINI-JEU : '+x.title+' • TERMINÉ APRÈS LA QUESTION '+mg.after_question;

function updateMiniGameTVClock(s){

  if(mg.game_type==='red_button'||mg.game_type==='reflex'){
    const wait=mgLeft(mg.go_at)>0;if(go)go.textContent=wait?'ATTENDS…':'GO !';if(timer)timer.textContent=mgFmt(wait?mgLeft(mg.go_at):mgLeft(mg.ends_at));

    const wait=mgLeft(mg.go_at)>0;

  }
}

async function playerHudData(s,p){
  const rows=await leaderboard(s,100);
  const rank=rows.findIndex(x=>x.id===p.id)+1;
  const total=rows.length;
  const prev=Number((rows.find(x=>x.id===p.id)||p).previous_rank||0);
  const delta=prev&&rank?prev-rank:0;
  return {rank,total,delta};
}
function playerHudHtml(s,se,p,h){

    '<div class="playerHudItem"><b>'+Number(p.score||0)+'</b><span>POINTS</span></div>'+
    '<div class="playerHudItem"><b>🔥 '+Number(p.streak||0)+'</b><span>SÉRIE</span></div>'+
    '</div><div class="playerHudProgress"><i style="width:'+pct+'%"></i></div>'+
    (h.delta?'<div class="playerHudMove '+(h.delta>0?'up':'down')+'">'+(h.delta>0?'▲ +'+h.delta+' place'+(h.delta>1?'s':''):'▼ '+Math.abs(h.delta)+' place'+(Math.abs(h.delta)>1?'s':''))+'</div>':'')+
  '</div>';
}
